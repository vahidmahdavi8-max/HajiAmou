name: Build Pasture APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'pasture-android-project.zip'
      - '.github/workflows/build-pasture.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project into Pasture
        shell: bash
        run: |
          test -f pasture-android-project.zip
          mkdir -p /tmp/pasture-source
          unzip -q pasture-android-project.zip -d /tmp/pasture-source
          PROJECT_ROOT="$(find /tmp/pasture-source -type f -name settings.gradle -o -name settings.gradle.kts | head -n 1 | xargs dirname)"
          if [ -z "$PROJECT_ROOT" ]; then
            echo "Could not find settings.gradle in the uploaded ZIP."
            exit 1
          fi
          mkdir -p Pasture
          cp -R "$PROJECT_ROOT"/. Pasture/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Pasture
          if ! git diff --cached --quiet; then
            git commit -m "Add Pasture Android project"
            git push
          fi

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        working-directory: Pasture
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pasture-debug-apk
          path: Pasture/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
