name: Build Pasture APK
on:
  workflow_dispatch:
  push:
    branches: [pasture-expansion]
    paths:
      - 'Pasture/**'
      - '.github/workflows/build-pasture.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pasture-expansion
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify preinstalled Android SDK and audio tools
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt"
          ffmpeg -version
          python3 -c "import requests"
      - name: Download 50+ licensed animal recordings
        run: python3 Pasture/tools/download_animal_sounds.py
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: Pasture
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Pasture-animal-sounds-apk
          path: Pasture/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
