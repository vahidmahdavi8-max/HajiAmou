name: Build Pasture APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'pasture-android-project.zip'
      - 'Pasture/**'
      - '.github/workflows/build-pasture.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project into Pasture if needed
        shell: bash
        run: |
          if [ ! -f Pasture/settings.gradle ] && [ ! -f Pasture/settings.gradle.kts ]; then
            mkdir -p /tmp/pasture-source
            unzip -q pasture-android-project.zip -d /tmp/pasture-source
            PROJECT_ROOT="$(find /tmp/pasture-source -type f \\( -name settings.gradle -o -name settings.gradle.kts \\) -print -quit | xargs dirname)"
            test -n "$PROJECT_ROOT"
            mkdir -p Pasture
            cp -R "$PROJECT_ROOT"/. Pasture/
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Pasture
            if ! git diff --cached --quiet; then
              git commit -m "Add Pasture Android project"
              git push
            fi
          fi

      - name: Install Android SDK packages
        shell: bash
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: Pasture
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pasture-debug-apk
          path: Pasture/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
